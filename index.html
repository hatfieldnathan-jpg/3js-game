<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Maple Street 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#9ad;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,40,.55);color:#fff;text-align:center;cursor:pointer;z-index:5}
#ov div{background:rgba(0,0,0,.5);padding:24px 32px;border-radius:14px;max-width:330px}
#ov h1{margin:0 0 8px;font-size:28px}#ov p{margin:4px 0;font-size:14px;opacity:.9}
#hud{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));color:#fff;font-size:12px;text-shadow:0 1px 3px #000;z-index:4;pointer-events:none}
#dot{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%;opacity:.7;z-index:4;pointer-events:none}
#joy{position:fixed;left:24px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.2);display:none;z-index:4;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6)}
#nb{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:6;padding:8px 12px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-size:13px}
#spr{position:fixed;right:14px;top:calc(58px + env(safe-area-inset-top,0px));z-index:6;padding:8px 12px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-size:13px}
#spr.on{background:rgba(255,180,60,.7)}
#mm{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:130px;height:130px;border-radius:10px;border:2px solid rgba(255,255,255,.5);z-index:4;pointer-events:none}
</style></head><body>
<div id="ov"><div><h1>Maple Street</h1><p>Click to start walking</p><p><b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump · <b>Mouse</b> look</p><p><b>N</b> day/night · <b>Esc</b> release mouse</p><p>Touch: left stick moves, drag right side to look</p></div></div>
<div id="dot"></div><div id="hud">WASD / Shift / Space · N = day/night</div>
<button id="nb">🌙 Night</button>
<button id="spr">🏃 Sprint</button>
<canvas id="mm" width="130" height="130"></canvas>
<div id="joy"><div id="knob"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const PI=Math.PI,scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,340);
camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647},pick=a=>a[rnd()*a.length|0];
const mc={},M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9},o||{})),C=c=>mc[c]||(mc[c]=M(c));
const bx=(p,w,h,d,m,x,y,z,sh)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof m==='number'?C(m):m);o.position.set(x,y,z);o.castShadow=sh!==false;o.receiveShadow=true;p.add(o);return o};
const cl=(p,g,m,x,y,z,sh)=>{const o=new THREE.Mesh(g,typeof m==='number'?C(m):m);o.position.set(x,y,z);o.castShadow=sh!==false;p.add(o);return o};
const tex=(w,h,f,rx,ry)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);return t};

// Grid constants
const GRID=[-50,0,50],PERIM=78,ROAD_HALF=4,SW_W=2,ROAD_W=8;

// Lights
const hemi=new THREE.HemisphereLight(0xcfe8ff,0x557744,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d0,1);sun.position.set(50,80,30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-95;sc.right=95;sc.top=95;sc.bottom=-95;sc.far=280;
scene.add(sun,sun.target);
const winMat=M(0x88b7dd,{emissive:0xffcc66,emissiveIntensity:0,roughness:.2});
const lampMat=M(0xffffcc,{emissive:0xffdd88,emissiveIntensity:0});
const headMat=M(0xffffee,{emissive:0xffffcc,emissiveIntensity:0});
const tailMat=M(0x990000,{emissive:0xff0000,emissiveIntensity:0});

// Ground
const gtex=tex(128,128,x=>{x.fillStyle='#4f8f3f';x.fillRect(0,0,128,128);for(let i=0;i<700;i++){x.fillStyle=rnd()<.5?'#468536':'#5c9e4a';x.fillRect(rnd()*128,rnd()*128,2,3)}},120,120);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(460,460).rotateX(-PI/2),new THREE.MeshStandardMaterial({map:gtex,roughness:1}));
gr.receiveShadow=true;scene.add(gr);

const boxes=[],circles=[];
const addBox=(x,z,w,d)=>boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});
const wb=(g,lx,lz,w,d)=>{const s=Math.sin(g.rotation.y),c=Math.cos(g.rotation.y);const x=g.position.x+lx*c+lz*s,z=g.position.z-lx*s+lz*c;const sw=Math.abs(s)>.5,W=sw?d:w,D=sw?w:d;boxes.push({x0:x-W/2,x1:x+W/2,z0:z-D/2,z1:z+D/2})};

// Roads (3x3 grid, extended)
GRID.forEach(g=>{
  bx(scene,PERIM*2,.05,ROAD_W,0x333338,0,.03,g,false);
  bx(scene,ROAD_W,.05,PERIM*2,0x333338,g,.035,0,false);
  for(let x=-PERIM+4;x<=PERIM-4;x+=4){
    if(GRID.some(gg=>Math.abs(x-gg)<ROAD_HALF+2))continue;
    bx(scene,2,.02,.25,0xf0d040,x,.07,g,false);
  }
  for(let z=-PERIM+4;z<=PERIM-4;z+=4){
    if(GRID.some(gg=>Math.abs(z-gg)<ROAD_HALF+2))continue;
    bx(scene,.25,.02,2,0xf0d040,g,.075,z,false);
  }
});

// Sidewalk segments - only between intersections
const bounds=[-PERIM];
GRID.forEach(g=>{bounds.push(g-ROAD_HALF);bounds.push(g+ROAD_HALF)});
bounds.push(PERIM);
GRID.forEach(gz=>{
  [gz-ROAD_HALF-SW_W/2,gz+ROAD_HALF+SW_W/2].forEach(sz=>{
    for(let i=0;i<bounds.length-1;i+=2){
      const x0=bounds[i],x1=bounds[i+1];
      if(x1-x0>0.5)bx(scene,x1-x0,.08,SW_W,0xb8b8b0,(x0+x1)/2,.04,sz,false);
    }
  });
});
GRID.forEach(gx=>{
  [gx-ROAD_HALF-SW_W/2,gx+ROAD_HALF+SW_W/2].forEach(sx=>{
    for(let i=0;i<bounds.length-1;i+=2){
      const z0=bounds[i],z1=bounds[i+1];
      if(z1-z0>0.5)bx(scene,SW_W,.08,z1-z0,0xb8b8b0,sx,.045,(z0+z1)/2,false);
    }
  });
});

// Crosswalks
GRID.forEach(gx=>GRID.forEach(gz=>{
  [gz-3.5,gz+3.5].forEach(cz=>{
    for(let k=-3;k<=3;k++)bx(scene,.45,.02,1.2,0xeeeeee,gx+k*1.1,.09,cz,false);
  });
  [gx-3.5,gx+3.5].forEach(cx=>{
    for(let k=-3;k<=3;k++)bx(scene,1.2,.02,.45,0xeeeeee,cx,.09,gz+k*1.1,false);
  });
}));

// Fences - collect segments, build instanced mesh later
const fenceSegs=[];
function fenceLine(x1,z1,x2,z2){
  fenceSegs.push({x1,z1,x2,z2});
  const cw=Math.max(0.35,Math.abs(x2-x1)),cd=Math.max(0.35,Math.abs(z2-z1));
  addBox((x1+x2)/2,(z1+z2)/2,cw,cd);
}

// Houses
const wallC=[0xe8d8b8,0xc9d9e8,0xe8b8a8,0xb8d8b8,0xf0e0a0,0xd8c0d8,0xe0e0e0,0x9fb8c8],
roofC=[0x8a3b2e,0x4a4a55,0x6b4a2e,0x2f4f5f],
doorC=[0x5a3a22,0x8a2222,0x225588,0x226644],
flC=[0xff6688,0xffdd33,0xff4444,0xbb66ff,0xffffff];
const bushG=new THREE.IcosahedronGeometry(.7,0),flG=new THREE.SphereGeometry(.13,5,4);
const placedHouses=[];
const PK={x:22,z:22},MK={x:-22,z:-22};

function house(x,z,rot){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
  const t=rnd()*4|0,w=7.5+rnd()*3,d=6+rnd()*2,wc=pick(wallC),rc=pick(roofC);let H=3.6+rnd()*.6,dx=0;
  const gable=(w,d,y,rf,ox,oz)=>{const s=new THREE.Shape();s.moveTo(-w/2-.5,0);s.lineTo(w/2+.5,0);s.lineTo(0,rf);
    const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d+1,bevelEnabled:false}).translate(0,0,-(d+1)/2),C(rc));m.position.set(ox,y,oz);m.castShadow=true;g.add(m)};
  const hip=(w,d,y,rf,ox,oz)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(1,rf,4).rotateY(PI/4),C(rc));m.scale.set((w+1)/1.414,1,(d+1)/1.414);m.position.set(ox,y+rf/2,oz);m.castShadow=true;g.add(m)};
  let parts=[[0,0,w,d,H]];
  if(t===1)parts[0][4]=H*=1.7;
  if(t===2)parts[0][4]=H=3.2;
  if(t===3){parts=[[-w*.15,0,w*.7,d,H],[w*.45,1.5,w*.5,d+3,H-.3]];dx=-w*.15}
  parts.forEach(([cx,cz,pw,pd,ph],i)=>{
    bx(g,pw,ph,pd,wc,cx,ph/2,cz);wb(g,cx,cz,pw,pd);
    [-1,1].forEach(s=>{const wz=cz+s*pd/2;
      for(let f=0;f<(ph>5?2:1);f++)[-.28,.28].forEach(k=>{const wx=cx+pw*k;
        if(s>0&&f===0&&i===0&&Math.abs(wx-dx)<1.7)return;
        bx(g,1.3,1.2,.1,winMat,wx,1.9+f*3,wz+s*.04,false)})})});
  if(t===0){gable(w,d,H,2.6,0,0);bx(g,.9,2.4,.9,0x884433,w*.3,H+1.2,-d*.2)}
  if(t===1){hip(w,d,H,3.2,0,0);bx(g,3,.15,1.2,0x555555,dx,2.7,d/2+.7)}
  if(t===2){bx(g,w+.6,.25,d+.6,0x3a3a40,0,3.3,0);bx(g,w*.6,2.8,d*.9,pick(wallC),w*.2,4.83,0);bx(g,w*.6+.6,.25,d*.9+.6,0x3a3a40,w*.2,6.35,0);bx(g,w*.4,2,.1,winMat,-w*.2,1.6,d/2+.05,false)}
  if(t===3){gable(w*.7,d,H,2.4,-w*.15,0);hip(w*.5,d+3,H-.3,2.2,w*.45,1.5);bx(g,.9,2.4,.9,0x884433,-w*.3,H+1.2,-d*.2)}
  bx(g,1.2,2.2,.12,pick(doorC),dx,1.1,d/2+.05);bx(g,2.6,.2,1.6,0x999990,dx,.1,d/2+.8,false);bx(g,.2,.3,.2,lampMat,dx+1,2.6,d/2+.15,false);
  bx(g,1.4,.06,6.2-d/2,0xaaa9a0,dx,.04,(d/2+6.2)/2,false);
  // Yard props
  bx(g,2.4,.25,.6,0x4a3020,dx-3.2<-w/2?-w/2+1.5:dx-3,.12,d/2+.6,false);
  for(let i=0;i<7;i++){const fx=(dx-3<-w/2?-w/2+1.5:dx-3)+(i-3)*.33;cl(g,flG,pick(flC),fx,.38,d/2+.5+(i%2)*.2,false)}
  [-w/2+.3,w/2-.3].forEach(a=>cl(g,bushG,0x2f7a35,a,.6,d/2+.5));
  const e=rnd()*3|0;
  if(e===0){bx(g,2.4,2.2,2.2,0x9a6b3a,3,1.1,-d/2-2.5);bx(g,2.8,.2,2.6,0x553322,3,2.3,-d/2-2.5);wb(g,3,-d/2-2.5,2.4,2.2)}
  if(e===1){bx(g,4.2,.25,2.8,0xeeeeee,-2,.1,-d/2-3,false);bx(g,3.8,.3,2.4,0x3399dd,-2,.12,-d/2-3,false)}
  if(e===2){cl(g,new THREE.CylinderGeometry(1.2,1.2,.15,12),0x222222,-2,.9,-d/2-3);cl(g,new THREE.CylinderGeometry(.06,.06,.9,4),0x888888,-2,.45,-d/2-3)}
  // Mailbox
  bx(g,.1,1,.1,0x553311,-5.5,.5,6.8);bx(g,.4,.4,.7,0x2244aa,-5.5,1.1,6.8);
  // 3D fences
  const c=Math.cos(rot),s=Math.sin(rot);
  const w2=(lx,lz)=>[x+lx*c+lz*s,z-lx*s+lz*c];
  const rs=t===3?1.2:w/2-.4;
  let a=w2(-7,6.2),b=w2(-1.2,6.2);fenceLine(a[0],a[1],b[0],b[1]);
  a=w2(rs,6.2);b=w2(7,6.2);fenceLine(a[0],a[1],b[0],b[1]);
  a=w2(-7,-4.5);b=w2(-7,6.2);fenceLine(a[0],a[1],b[0],b[1]);
  a=w2(7,-4.5);b=w2(7,6.2);fenceLine(a[0],a[1],b[0],b[1]);
  a=w2(-7,-4.5);b=w2(7,-4.5);fenceLine(a[0],a[1],b[0],b[1]);
}

const offsets=[-70,-30,30,70];
function tryPlace(x,z,rot){
  if(Math.abs(x)>82||Math.abs(z)>82)return;
  if(Math.hypot(x-PK.x,z-PK.z)<16)return;
  if(Math.hypot(x-MK.x,z-MK.z)<15)return;
  for(const h of placedHouses)if(Math.hypot(h.x-x,h.z-z)<11.5)return;
  placedHouses.push({x,z});house(x,z,rot);
}
GRID.forEach(gz=>{offsets.forEach(x=>{tryPlace(x,gz-15,0);tryPlace(x,gz+15,PI)})});
GRID.forEach(gx=>{offsets.forEach(z=>{tryPlace(gx-15,z,PI/2);tryPlace(gx+15,z,-PI/2)})});

// Build instanced fences
(function(){
  const mat=new THREE.MeshStandardMaterial({color:0xf0ece0,roughness:.95});
  const postGeo=new THREE.BoxGeometry(.13,.95,.13);
  const railGeo=new THREE.BoxGeometry(1,.09,.06);
  const posts=[],rails=[];
  fenceSegs.forEach(s=>{
    const dx=s.x2-s.x1,dz=s.z2-s.z1,L=Math.hypot(dx,dz);
    if(L<0.4)return;
    const n=Math.max(2,Math.round(L/1.8)+1);
    for(let i=0;i<n;i++){const t=i/(n-1);posts.push({x:s.x1+dx*t,z:s.z1+dz*t})}
    const cx=(s.x1+s.x2)/2,cz=(s.z1+s.z2)/2,ry=Math.atan2(-dz,dx);
    rails.push({x:cx,y:0.30,z:cz,ry,len:L});
    rails.push({x:cx,y:0.72,z:cz,ry,len:L});
  });
  const pm=new THREE.InstancedMesh(postGeo,mat,posts.length);pm.castShadow=true;pm.receiveShadow=true;
  const dm=new THREE.Object3D();
  posts.forEach((p,i)=>{dm.position.set(p.x,.475,p.z);dm.rotation.set(0,0,0);dm.scale.set(1,1,1);dm.updateMatrix();pm.setMatrixAt(i,dm.matrix)});
  pm.instanceMatrix.needsUpdate=true;scene.add(pm);
  const rm=new THREE.InstancedMesh(railGeo,mat,rails.length);rm.castShadow=true;rm.receiveShadow=true;
  rails.forEach((r,i)=>{dm.position.set(r.x,r.y,r.z);dm.rotation.set(0,r.ry,0);dm.scale.set(r.len,1,1);dm.updateMatrix();rm.setMatrixAt(i,dm.matrix)});
  rm.instanceMatrix.needsUpdate=true;scene.add(rm);
})();

// Market
(function(){
  const g=new THREE.Group();g.position.set(MK.x,0,MK.z);scene.add(g);
  const w=14,d=8;
  bx(g,w,4.5,d,0xd9c9a8,0,2.25,0);wb(g,0,0,w,d);
  bx(g,w+.6,.3,d+.6,0x7a2a2a,0,4.65,0);
  bx(g,w*.7,2.4,.1,winMat,0,1.5,d/2+.05,false);
  bx(g,w*.9,.2,1.8,0xc0392b,0,3.4,d/2+.9,false).rotation.x=.3;
  const tx=tex(256,64,x=>{x.fillStyle='#1a5c3a';x.fillRect(0,0,256,64);x.fillStyle='#fff';x.font='bold 34px sans-serif';x.textAlign='center';x.fillText('MAPLE MARKET',128,44)});
  const s=new THREE.Mesh(new THREE.PlaneGeometry(7,1.75),new THREE.MeshBasicMaterial({map:tx}));
  s.position.set(0,5.9,d/2+.1);g.add(s);
  bx(g,7.2,2,.2,0x333333,0,5.9,d/2,false);
  bx(g,2.4,.5,.9,0x7a5a3a,-5,.3,d/2+3.5);bx(g,2.4,.5,.2,0x7a5a3a,-5,.8,d/2+3.9);
})();

// Park (with fountain)
const fountainDrops=[];
(function(){
  const g=new THREE.Group();g.position.set(PK.x,0,PK.z);scene.add(g);
  // Stone rim
  cl(g,new THREE.CylinderGeometry(6,6.3,1,28),0xbbbbaa,0,.5,0);
  // Water surface
  cl(g,new THREE.CylinderGeometry(5.5,5.5,.2,28),M(0x3a7ac0,{roughness:.15,transparent:true,opacity:.85}),0,.95,0,false);
  // Central pillar
  cl(g,new THREE.CylinderGeometry(.7,.9,3,12),0xbbbbaa,0,2,0);
  cl(g,new THREE.CylinderGeometry(1.5,1.5,.3,12),0xbbbbaa,0,3.5,0);
  cl(g,new THREE.SphereGeometry(.4,8,6),0xbbbbaa,0,3.9,0);
  // Water drops
  const dropGeo=new THREE.SphereGeometry(.16,6,4);
  for(let i=0;i<10;i++){
    const angle=(i/10)*PI*2,stream=[];
    for(let j=0;j<5;j++){
      const d=new THREE.Mesh(dropGeo,new THREE.MeshStandardMaterial({color:0xaaddff,transparent:true,opacity:.9,roughness:.1}));
      g.add(d);stream.push(d);
    }
    fountainDrops.push({stream,angle,phase:i/10});
  }
  circles.push({x:PK.x,z:PK.z,r:6});

  // Benches around fountain
  for(let i=0;i<6;i++){
    const a=i/6*PI*2+.3,bbx=Math.cos(a)*10,bbz=Math.sin(a)*10,b=new THREE.Group();
    b.position.set(bbx,0,bbz);b.rotation.y=-a-PI/2;g.add(b);
    bx(b,2,.15,.6,0x7a5a3a,0,.5,0);bx(b,2,.5,.1,0x7a5a3a,0,.85,-.3);
    bx(b,.1,.5,.5,0x333333,-.9,.25,0);bx(b,.1,.5,.5,0x333333,.9,.25,0);
    circles.push({x:PK.x+bbx,z:PK.z+bbz,r:.9});
  }
  // Gazebo
  const z=new THREE.Group();z.position.set(10,0,9);g.add(z);
  cl(z,new THREE.CylinderGeometry(2.4,2.4,.3,8),0xbbbbaa,0,.15,0);
  for(let i=0;i<6;i++){const a=i/6*PI*2;cl(z,new THREE.CylinderGeometry(.1,.1,2.8,5),0xeeeeee,Math.cos(a)*2.1,1.6,Math.sin(a)*2.1);
    circles.push({x:PK.x+10+Math.cos(a)*2.1,z:PK.z+9+Math.sin(a)*2.1,r:.15})}
  cl(z,new THREE.ConeGeometry(3,1.8,8),0x7a2a2a,0,3.85,0);
  addBox(PK.x+10,PK.z+9,5.4,5.4);
  // Swings - single pole each side
  const s=new THREE.Group();s.position.set(-10,0,9);g.add(s);
  [-2.2,2.2].forEach(a=>bx(s,.14,2.8,.14,0x3366aa,a,1.4,0));
  bx(s,4.8,.14,.14,0x3366aa,0,2.8,0);
  [-.8,.8].forEach(a=>{
    bx(s,.04,2.1,.04,0x888888,a,1.7,0);
    bx(s,.6,.08,.3,0xdd8833,a,.55,0);
  });
  addBox(PK.x-10,PK.z+9,5.2,1.4);
  // Slide
  const sl=new THREE.Group();sl.position.set(-10,0,-6);g.add(sl);
  bx(sl,1.1,.1,3.4,0xdd3333,0,1.2,0).rotation.x=.5;
  bx(sl,1.3,.1,1.1,0xdddd33,0,2,-1.5);
  bx(sl,.1,2,.1,0x555555,-.55,1,-1.6);bx(sl,.1,2,.1,0x555555,.55,1,-1.6);
  addBox(PK.x-10,PK.z-6,2.6,3.6);
})();

// Trees
const trunkG=new THREE.CylinderGeometry(.2,.3,2.2,6),leafC=[0x2f7a35,0x3f9a45,0x2a6a30,0xb86a2a,0xc9a030];

  else{const c=pick(leafC);cl(g,new THREE.IcosahedronGeometry(1.7,1),c,0,3.6,0);cl(g,new THREE.IcosahedronGeometry(1.1,1),c,.9,4.4,.4)}
  circles.push({x,z,r:.4*s});
}
for(let i=0,n=0;i<900&&n<60;i++){
  const x=(rnd()-.5)*170,z=(rnd()-.5)*150;
  if(GRID.some(g=>Math.abs(x-g)<ROAD_HALF+SW_W+2)||GRID.some(g=>Math.abs(z-g)<ROAD_HALF+SW_W+2))continue;

// Extra props: benches along sidewalks + trash cans
for(let i=-70;i<=70;i+=24){

// Parked cars
const carC=[0xc0392b,0x2980b9,0xf1c40f,0xecf0f1,0x27ae60,0x2c3e50,0xe67e22];
function car(p){
  const g=new THREE.Group(),c=pick(carC),k=rnd()*3|0;p.add(g);
  bx(g,4.2,.8,1.9,M(c,{roughness:.35}),0,.7,0);
  if(k===0)bx(g,2.2,.75,1.7,0x99bbdd,-.2,1.45,0);
  if(k===1)bx(g,2.9,.85,1.75,0x99bbdd,-.5,1.5,0);
  if(k===2){bx(g,1.3,.7,1.7,0x99bbdd,.4,1.45,0);bx(g,1.6,.4,1.8,c,-1.2,1.1,0)}
  [[-1.3,-.95],[1.3,-.95],[-1.3,.95],[1.3,.95]].forEach(a=>cl(g,new THREE.CylinderGeometry(.38,.38,.3,12).rotateX(PI/2),0x111111,a[0],.38,a[1]));

function parked(x,z,rot){

  boxes.push({x0:x-(sw?.95:2.1),x1:x+(sw?.95:2.1),z0:z-(sw?2.1:.95),z1:z+(sw?2.1:.95)});
}
GRID.forEach(gz=>{
  [[gz-3.05,0],[gz+3.05,PI]].forEach(([z,rot])=>{

    });

});
GRID.forEach(gx=>{
  [[gx-3.05,PI/2],[gx+3.05,-PI/2]].forEach(([x,rot])=>{

      if(GRID.some(g=>Math.abs(z-g)<9))return;

    });

});

// Loop-based moving cars
function makeLoop(pts){
  const segs=[];let total=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length];
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    segs.push({a,b,len,start:total});total+=len;
  }
  return {segs,total};
}
function placeOnLoop(loop,dist){
  const d=((dist%loop.total)+loop.total)%loop.total;
  for(const s of loop.segs){
    if(d<s.start+s.len){
      const t=(d-s.start)/s.len;
      const x=s.a[0]+(s.b[0]-s.a[0])*t;
      const z=s.a[1]+(s.b[1]-s.a[1])*t;
      const angle=Math.atan2(-(s.b[1]-s.a[1]),s.b[0]-s.a[0]);
      return {x,z,angle};
    }
  }
  return {x:0,z:0,angle:0};
}
// Lane offset = 1.1 from road center
const L=1.1;
const loops=[
  // Perimeter (outer lanes)
  makeLoop([[-50-L,-50-L],[50+L,-50-L],[50+L,50+L],[-50-L,50+L]]),
  // 4 blocks (inner lanes)
  makeLoop([[-50+L,-50+L],[-L,-50+L],[-L,-L],[-50+L,-L]]),
  makeLoop([[L,-50+L],[50-L,-50+L],[50-L,-L],[L,-L]]),
  makeLoop([[-50+L,L],[-L,L],[-L,50-L],[-50+L,50-L]]),
  makeLoop([[L,L],[50-L,L],[50-L,50-L],[L,50-L]]),
];
const cars=[];
loops.forEach((loop,li)=>{
  const count=li===0?6:2;
  for(let i=0;i<count;i++){
    const g=car(scene);
    cars.push({g,loop,dist:(i/count)*loop.total,speed:7+rnd()*3,base:7+rnd()*3,slow:0});
  }
});

// Pedestrians with arms
const skinC=[0xf1c27d,0xc68642,0x8d5524,0xffdbac],shirtC=[0xc0392b,0x2980b9,0x8e44ad,0x16a085,0xe67e22,0x34495e];
function person(){
  const g=new THREE.Group(),legs=[],arms=[];
  bx(g,.5,.7,.3,pick(shirtC),0,1.15,0);
  cl(g,new THREE.SphereGeometry(.17,8,6),pick(skinC),0,1.7,0);
  [-.13,.13].forEach(x=>{
    const p=new THREE.Group();p.position.set(x,.8,0);
    bx(p,.18,.8,.2,0x2c3e50,0,-.4,0);
    g.add(p);legs.push(p);
  });
  [-.34,.34].forEach(x=>{
    const p=new THREE.Group();p.position.set(x,1.4,0);
    bx(p,.14,.65,.16,pick(shirtC),0,-.32,0);
    bx(p,.12,.15,.14,pick(skinC),0,-.72,0);
    g.add(p);arms.push(p);
  });
  g.userData.legs=legs;g.userData.arms=arms;
  scene.add(g);return g;
}
const walkers=[];
for(let i=0;i<16;i++){
  const ax=i%2?'x':'z',c=pick([4.8,-4.8]);
  const lane=i<8?0:(i<12?50:-50);
  walkers.push({g:person(),ax,c:c+lane,dir:rnd()<.5?1:-1,pos:(rnd()-.5)*140,sp:1.3+rnd()*.8,L:70});
}

// Sky
const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,fog:false}),clouds=[];
for(let i=0;i<16;i++){
  const g=new THREE.Group();
  for(let j=0;j<4;j++)cl(g,new THREE.SphereGeometry(4+rnd()*3,8,6),cloudMat,j*5-8,rnd()*2,rnd()*3,false);
  g.position.set((rnd()-.5)*360,60+rnd()*20,(rnd()-.5)*360);g.scale.y=.5;scene.add(g);clouds.push(g);
}
const sp=[];
for(let i=0;i<500;i++){const a=rnd()*PI*2,b=rnd()*1.4+.1;sp.push(Math.cos(a)*Math.cos(b)*300,Math.sin(b)*300,Math.sin(a)*Math.cos(b)*300)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));
scene.add(stars);
const dayC=new THREE.Color(0x8fc4f0),nightC=new THREE.Color(0x070b20);
scene.background=dayC.clone();scene.fog=new THREE.Fog(0x8fc4f0,60,220);
let nT=0,nTarget=0;
function setT(t){
  scene.background.copy(dayC).lerp(nightC,t);scene.fog.color.copy(scene.background);
  hemi.intensity=.75-.57*t;sun.intensity=1-.87*t;
  winMat.emissiveIntensity=t*.9;lampMat.emissiveIntensity=t*1.6;
  headMat.emissiveIntensity=t*1.6;tailMat.emissiveIntensity=t;
  stars.material.opacity=t;
  const v=1-.8*t;cloudMat.color.setRGB(v,v,v);
}
const nb=document.getElementById('nb');
function toggleNight(){nTarget=nTarget?0:1;nb.textContent=nTarget?'☀️ Day':'🌙 Night'}
nb.addEventListener('click',toggleNight);

// Sprint toggle
let sprintToggle=false;
const spr=document.getElementById('spr');
spr.addEventListener('click',()=>{sprintToggle=!sprintToggle;spr.classList.toggle('on',sprintToggle)});

// Player & input
const P={x:0,z:9,y:0,vy:0,yaw:PI,pitch:0,bob:0},keys={};let locked=false,touch=false;
const ov=document.getElementById('ov'),cv=renderer.domElement;
ov.addEventListener('click',()=>{if(touch){ov.style.display='none';locked=true;return}cv.requestPointerLock&&cv.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;ov.style.display=locked?'none':'flex'});
document.addEventListener('mousemove',e=>{if(!locked||touch)return;P.yaw-=e.movementX*.0022;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*.0022))});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyN')toggleNight();
  if(e.code==='KeyC'){sprintToggle=!sprintToggle;spr.classList.toggle('on',sprintToggle)}
  if(e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);

const joy=document.getElementById('joy'),knob=document.getElementById('knob'),tv={x:0,y:0};
let joyId=null,lookId=null,lx=0,ly=0;
addEventListener('touchstart',()=>{if(!touch){touch=true;joy.style.display='block'}},{once:true});
joy.addEventListener('touchstart',e=>{joyId=e.changedTouches[0].identifier;e.preventDefault()},{passive:false});
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches)
    if(t.identifier!==joyId&&t.clientX>innerWidth*.4&&lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY}
});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const r=joy.getBoundingClientRect();let dx=t.clientX-(r.left+55),dy=t.clientY-(r.top+55);
      const l=Math.hypot(dx,dy);if(l>45){dx*=45/l;dy*=45/l}
      tv.x=dx/45;tv.y=dy/45;knob.style.transform=`translate(${dx}px,${dy}px)`;
    }else if(t.identifier===lookId){
      P.yaw-=(t.clientX-lx)*.005;
      P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-(t.clientY-ly)*.005));
      lx=t.clientX;ly=t.clientY;
    }
  }
},{passive:true});
addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyId=null;tv.x=tv.y=0;knob.style.transform=''}
    if(t.identifier===lookId)lookId=null;
  }
});

// Collision
function collide(){
  const R=.45;
  for(const b of boxes){
    const cx=Math.max(b.x0,Math.min(P.x,b.x1)),cz=Math.max(b.z0,Math.min(P.z,b.z1));
    let dx=P.x-cx,dz=P.z-cz,d=Math.hypot(dx,dz);
    if(d<R){if(d===0){P.x=b.x0-R;continue}P.x=cx+dx/d*R;P.z=cz+dz/d*R}
  }
  for(const c of circles){
    const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz),m=c.r+R;
    if(d<m&&d>0){P.x=c.x+dx/d*m;P.z=c.z+dz/d*m}
  }
  P.x=Math.max(-95,Math.min(95,P.x));P.z=Math.max(-95,Math.min(95,P.z));
}

// Minimap
const mm=document.getElementById('mm'),mctx=mm.getContext('2d');
function drawMM(){
  mctx.fillStyle='rgba(30,70,30,.85)';mctx.fillRect(0,0,130,130);
  const k=.6,o=65;
  mctx.fillStyle='#555';
  GRID.forEach(gz=>{mctx.fillRect(o-PERIM*k,o+gz*k-ROAD_HALF*k,PERIM*2*k,ROAD_W*k)});
  GRID.forEach(gx=>{mctx.fillRect(o+gx*k-ROAD_HALF*k,o-PERIM*k,ROAD_W*k,PERIM*2*k)});
  mctx.fillStyle='#9ab';
  boxes.forEach(b=>mctx.fillRect(o+b.x0*k,o+b.z0*k,Math.max(1,(b.x1-b.x0)*k),Math.max(1,(b.z1-b.z0)*k)));
  mctx.fillStyle='#fa0';
  cars.forEach(c=>mctx.fillRect(o+c.g.position.x*k-1,o+c.g.position.z*k-1,3,3));
  mctx.save();mctx.translate(o+P.x*k,o+P.z*k);mctx.rotate(-P.yaw);
  mctx.fillStyle='#fff';mctx.beginPath();mctx.moveTo(0,-5);mctx.lineTo(3.5,4);mctx.lineTo(-3.5,4);mctx.fill();
  mctx.restore();
}

let last=performance.now(),tm=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;
  if(Math.abs(nT-nTarget)>.002){nT+=(nTarget-nT)*Math.min(1,dt*1.5);setT(nT)}

  // Player movement
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-tv.y;
  let s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+tv.x;
  const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
  const sprinting=keys.ShiftLeft||keys.ShiftRight||sprintToggle;
  const spd=(sprinting?8:4.2)*dt;
  if(locked){
    const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
    P.x+=(-sy*f+cy*s)*spd;P.z+=(-cy*f-sy*s)*spd;
    collide();
    if(l>0&&P.y===0)P.bob+=spd*1.6;
    if(keys.Space&&P.y===0)P.vy=6;
    P.vy-=18*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0)P.vy=0;
  }

  // Moving cars along loops
  cars.forEach(c=>{
    // Slow for player
    const p=placeOnLoop(c.loop,c.dist);
    const dx=P.x-p.x,dz=P.z-p.z,dist=Math.hypot(dx,dz);
    let target=c.base;
    if(dist<8){
      const fwdX=Math.cos(p.angle),fwdZ=-Math.sin(p.angle);
      const dot=dx*fwdX+dz*fwdZ;
      if(dot>0&&dist<6)target=0;
    }
    c.speed+=(target-c.speed)*Math.min(1,dt*3);
    c.dist+=c.speed*dt;
    const np=placeOnLoop(c.loop,c.dist);
    c.g.position.set(np.x,0,np.z);
    c.g.rotation.y=np.angle;
  });

  // Pedestrians
  walkers.forEach(w=>{
    w.pos+=w.dir*w.sp*dt;
    if(Math.abs(w.pos)>w.L)w.dir*=-1;
    const g=w.g;
    if(w.ax==='x'){g.position.set(w.pos,0,w.c);g.rotation.y=w.dir>0?PI/2:-PI/2}
    else{g.position.set(w.c,0,w.pos);g.rotation.y=w.dir>0?0:PI}
    const sw=Math.sin(tm*w.sp*5)*.6,lg=g.userData.legs,ar=g.userData.arms;
    lg[0].rotation.x=sw;lg[1].rotation.x=-sw;
    ar[0].rotation.x=-sw*.8;ar[1].rotation.x=sw*.8;
  });

  // Fountain animation
  fountainDrops.forEach(s=>{
    s.stream.forEach((d,j)=>{
      const t=((tm*1.1+s.phase+j*0.18)%1);
      const r=1.5+2.5*t;
      const y=3.5+3*Math.sin(t*PI)-2.65*t;
      d.position.set(Math.cos(s.angle)*r,Math.max(.9,y),Math.sin(s.angle)*r);
      d.material.opacity=0.9*Math.max(0,1-Math.max(0,(t-0.85)*6));
    });
  });

  // Clouds
  clouds.forEach(c=>{c.position.x+=dt*2;if(c.position.x>200)c.position.x=-200});

  camera.position.set(P.x,1.7+P.y+Math.sin(P.bob)*.045,P.z);
  camera.rotation.set(P.pitch,P.yaw,0);
  stars.position.copy(camera.position);
  sun.position.set(P.x+50,80,P.z+30);
  sun.target.position.set(P.x,0,P.z);sun.target.updateMatrixWorld();

  renderer.render(scene,camera);
  drawMM();
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
requestAnimationFrame(loop);
})();
