<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Maple Street 2 — Districts</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>

#district{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);color:#fff;font-size:14px;font-weight:600;letter-spacing:.5px;text-shadow:0 2px 4px #000,0 0 8px #000;z-index:6;pointer-events:none;background:rgba(0,0,0,.35);padding:5px 12px;border-radius:16px}
#compass{position:fixed;left:50%;top:calc(46px + env(safe-area-inset-top,0px));transform:translateX(-50%);color:#fff;font-size:11px;opacity:.85;text-shadow:0 1px 3px #000;z-index:6;pointer-events:none}

#spr{position:fixed;right:14px;top:calc(58px + env(safe-area-inset-top,0px));z-index:7;padding:8px 12px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-size:13px}
#spr.on{background:rgba(255,180,60,.75)}
#mm{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:150px;height:150px;border-radius:10px;border:2px solid rgba(255,255,255,.5);z-index:6;pointer-events:none}
#legend{position:fixed;left:12px;top:calc(170px + env(safe-area-inset-top,0px));color:#fff;font-size:10px;z-index:6;background:rgba(0,0,0,.4);padding:6px 8px;border-radius:6px;line-height:1.4;pointer-events:none}
#legend b{color:#fff}#legend span{opacity:.9}
</style></head><body>
<div id="ov"><div><h1>Maple Street 2</h1><p>Click to start</p><p><b>WASD</b> move · <b>Shift/C</b> sprint · <b>Space</b> jump</p><p><b>N</b> day/night · <b>Esc</b> release mouse</p><p>Touch: left stick · drag right to look</p></div></div>
<div id="dot"></div>
<div id="district">Downtown</div>
<div id="compass">N</div>
<div id="hud">WASD · Sprint C · N day/night · Lights &amp; train active</div>
<button id="nb">🌙 Night</button>
<button id="spr">🏃 Sprint</button>
<canvas id="mm" width="150" height="150"></canvas>
<div id="legend"><b>Districts</b><br><span style="color:#7fb3ff">■</span> Downtown<br><span style="color:#8ed17a">■</span> Suburbs<br><span style="color:#c9a262">■</span> Industrial<br><span style="color:#e8c4a0">■</span> Beachfront</div>
<div id="joy"><div id="knob"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const PI=Math.PI,TAU=PI*2;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,900);
camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

let seed=17;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647},pick=a=>a[rnd()*a.length|0];
const mc={},M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9},o||{})),C=c=>mc[c]||(mc[c]=M(c));
const bx=(p,w,h,d,m,x,y,z,sh)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof m==='number'?C(m):m);o.position.set(x,y,z);o.castShadow=sh!==false;o.receiveShadow=true;p.add(o);return o};
const cl=(p,g,m,x,y,z,sh)=>{const o=new THREE.Mesh(g,typeof m==='number'?C(m):m);o.position.set(x,y,z);o.castShadow=sh!==false;p.add(o);return o};
const tex=(w,h,f,rx,ry)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);return t};

// ====================== GLOBALS / COLLISION ======================
const boxes=[],circles=[];
const addBox=(x,z,w,d)=>boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});
const wb=(g,lx,lz,w,d)=>{const s=Math.sin(g.rotation.y),c=Math.cos(g.rotation.y);const x=g.position.x+lx*c+lz*s,z=g.position.z-lx*s+lz*c;const sw=Math.abs(s)>.5,W=sw?d:w,D=sw?w:d;boxes.push({x0:x-W/2,x1:x+W/2,z0:z-D/2,z1:z+D/2})};

// ====================== LIGHTS ======================
const hemi=new THREE.HemisphereLight(0xcfe8ff,0x557744,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d0,1);sun.position.set(60,110,40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-140;sc.right=140;sc.top=140;sc.bottom=-140;sc.far=400;
scene.add(sun,sun.target);
const winMat=M(0x88b7dd,{emissive:0xffcc66,emissiveIntensity:0,roughness:.2});
const glassMat=M(0x6ea8c8,{emissive:0xffddaa,emissiveIntensity:0,roughness:.1,metalness:.3});
const lampMat=M(0xffffcc,{emissive:0xffdd88,emissiveIntensity:0});
const headMat=M(0xffffee,{emissive:0xffffcc,emissiveIntensity:0});
const tailMat=M(0x990000,{emissive:0xff0000,emissiveIntensity:0});
const tRed=M(0x330000,{emissive:0xff0000,emissiveIntensity:0});
const tYel=M(0x332200,{emissive:0xffcc00,emissiveIntensity:0});
const tGrn=M(0x002200,{emissive:0x00ff44,emissiveIntensity:0});

// ====================== GROUND ======================
const gtex=tex(160,160,x=>{x.fillStyle='#4f8f3f';x.fillRect(0,0,160,160);for(let i=0;i<1200;i++){x.fillStyle=rnd()<.5?'#468536':'#5c9e4a';x.fillRect(rnd()*160,rnd()*160,2,3)}},140,140);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(700,700).rotateX(-PI/2),new THREE.MeshStandardMaterial({map:gtex,roughness:1}));
gr.receiveShadow=true;scene.add(gr);

// ====================== ROADS (5x5 grid) ======================
const ROADS=[-150,-90,-30,30,90,150];
const ROAD_W=10,ROAD_HALF=5,SW_W=3;
const ROAD_LEN=340;

ROADS.forEach(x=>{
  bx(scene,ROAD_LEN,.05,ROAD_W,0x333338,x,.03,0,false);
  // lane marking
  for(let z=-ROAD_LEN/2+6;z<ROAD_LEN/2;z+=6){
    if(ROADS.some(g=>Math.abs(z-g)<ROAD_HALF+3))continue;
    bx(scene,.22,.02,3,0xf0d040,x,.075,z,false);
  }
});
ROADS.forEach(z=>{
  bx(scene,ROAD_W,.05,ROAD_LEN,0x333338,0,.035,z,false);
  for(let x=-ROAD_LEN/2+6;x<ROAD_LEN/2;x+=6){
    if(ROADS.some(g=>Math.abs(x-g)<ROAD_HALF+3))continue;
    bx(scene,3,.02,.22,0xf0d040,x,.075,z,false);
  }
});
// sidewalk segments (skip intersections)
const bounds=[-ROAD_LEN/2];ROADS.forEach(g=>{bounds.push(g-ROAD_HALF);bounds.push(g+ROAD_HALF)});bounds.push(ROAD_LEN/2);
ROADS.forEach(gz=>{
  [gz-ROAD_HALF-SW_W/2,gz+ROAD_HALF+SW_W/2].forEach(sz=>{
    for(let i=0;i<bounds.length-1;i+=2){const x0=bounds[i],x1=bounds[i+1];
      if(x1-x0>.5)bx(scene,x1-x0,.08,SW_W,0xb8b8b0,(x0+x1)/2,.04,sz,false)}
  });
});
ROADS.forEach(gx=>{
  [gx-ROAD_HALF-SW_W/2,gx+ROAD_HALF+SW_W/2].forEach(sx=>{
    for(let i=0;i<bounds.length-1;i+=2){const z0=bounds[i],z1=bounds[i+1];
      if(z1-z0>.5)bx(scene,SW_W,.08,z1-z0,0xb8b8b0,sx,.045,(z0+z1)/2,false)}
  });
});
// crosswalks
ROADS.forEach(gx=>ROADS.forEach(gz=>{
  [gz-3.6,gz+3.6].forEach(cz=>{for(let k=-3;k<=3;k++)bx(scene,.5,.02,1.4,0xeeeeee,gx+k*1.15,.09,cz,false)});
  [gx-3.6,gx+3.6].forEach(cx=>{for(let k=-3;k<=3;k++)bx(scene,1.4,.02,.5,0xeeeeee,cx,.09,gz+k*1.15,false)});
}));

// Beach road & port road extensions
bx(scene,320,.05,ROAD_W,0x333338,0,.03,210,false);
bx(scene,ROAD_W,.05,120,0x333338,210,.03,150,false);

// ====================== DISTRICTS ======================
function districtAt(x,z){
  if(z>170)return 'beachfront';
  if(x>170)return 'harbor';
  if(x<-30&&z<-30)return 'downtown';
  if(x>30&&z<-30)return 'suburbs';
  if(x<-30&&z>30)return 'industrial';
  if(x>30&&z>30)return 'beachfront';
  return 'downtown';
}
const DISTRICT_COLORS={downtown:'#7fb3ff',suburbs:'#8ed17a',industrial:'#c9a262',beachfront:'#e8c4a0',harbor:'#c48a8a'};

// ====================== 3D FENCES ======================
const fenceSegs=[];
function fenceLine(x1,z1,x2,z2){
  fenceSegs.push({x1,z1,x2,z2});
  const cw=Math.max(.35,Math.abs(x2-x1)),cd=Math.max(.35,Math.abs(z2-z1));
  addBox((x1+x2)/2,(z1+z2)/2,cw,cd);
}

// ====================== HOUSES (suburbs) ======================
const wallC=[0xe8d8b8,0xc9d9e8,0xe8b8a8,0xb8d8b8,0xf0e0a0,0xd8c0d8,0xe0e0e0,0x9fb8c8];
const roofC=[0x8a3b2e,0x4a4a55,0x6b4a2e,0x2f4f5f];
const doorC=[0x5a3a22,0x8a2222,0x225588,0x226644];
const flC=[0xff6688,0xffdd33,0xff4444,0xbb66ff,0xffffff];
const bushG=new THREE.IcosahedronGeometry(.7,0),flG=new THREE.SphereGeometry(.13,5,4);
const placedHouses=[];
function house(x,z,rot,withFence){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
  const t=rnd()*4|0,w=8+rnd()*3,d=6+rnd()*2,wc=pick(wallC),rc=pick(roofC);let H=3.6+rnd()*.6,dx=0;
  const gable=(w,d,y,rf,ox,oz)=>{const s=new THREE.Shape();s.moveTo(-w/2-.5,0);s.lineTo(w/2+.5,0);s.lineTo(0,rf);
    const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d+1,bevelEnabled:false}).translate(0,0,-(d+1)/2),C(rc));m.position.set(ox,y,oz);m.castShadow=true;g.add(m)};
  const hip=(w,d,y,rf,ox,oz)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(1,rf,4).rotateY(PI/4),C(rc));m.scale.set((w+1)/1.414,1,(d+1)/1.414);m.position.set(ox,y+rf/2,oz);m.castShadow=true;g.add(m)};
  let parts=[[0,0,w,d,H]];
  if(t===1)parts[0][4]=H*=1.7;
  if(t===2)parts[0][4]=H=3.2;
  if(t===3){parts=[[-w*.15,0,w*.7,d,H],[w*.45,1.5,w*.5,d+3,H-.3]];dx=-w*.15}
  parts.forEach(([cx,cz,pw,pd,ph],i)=>{
    bx(g,pw,ph,pd,wc,cx,ph/2,cz);wb(g,cx,cz,pw,pd);
    [-1,1].forEach(s=>{const wz=cz+s*pd/2;
      for(let f=0;f<(ph>5?2:1);f++)[-.28,.28].forEach(k=>{const wx=cx+pw*k;
        if(s>0&&f===0&&i===0&&Math.abs(wx-dx)<1.7)return;
        bx(g,1.3,1.2,.1,winMat,wx,1.9+f*3,wz+s*.04,false)})})});
  if(t===0){gable(w,d,H,2.6,0,0);bx(g,.9,2.4,.9,0x884433,w*.3,H+1.2,-d*.2)}
  if(t===1){hip(w,d,H,3.2,0,0);bx(g,3,.15,1.2,0x555555,dx,2.7,d/2+.7)}
  if(t===2){bx(g,w+.6,.25,d+.6,0x3a3a40,0,3.3,0);bx(g,w*.6,2.8,d*.9,pick(wallC),w*.2,4.83,0);bx(g,w*.6+.6,.25,d*.9+.6,0x3a3a40,w*.2,6.35,0);bx(g,w*.4,2,.1,winMat,-w*.2,1.6,d/2+.05,false)}
  if(t===3){gable(w*.7,d,H,2.4,-w*.15,0);hip(w*.5,d+3,H-.3,2.2,w*.45,1.5);bx(g,.9,2.4,.9,0x884433,-w*.3,H+1.2,-d*.2)}
  bx(g,1.2,2.2,.12,pick(doorC),dx,1.1,d/2+.05);
  bx(g,2.6,.2,1.6,0x999990,dx,.1,d/2+.8,false);
  bx(g,.2,.3,.2,lampMat,dx+1,2.6,d/2+.15,false);
  bx(g,1.4,.06,6.2-d/2,0xaaa9a0,dx,.04,(d/2+6.2)/2,false);
  bx(g,2.4,.25,.6,0x4a3020,dx-3.2<-w/2?-w/2+1.5:dx-3,.12,d/2+.6,false);
  for(let i=0;i<7;i++){const fx=(dx-3<-w/2?-w/2+1.5:dx-3)+(i-3)*.33;cl(g,flG,pick(flC),fx,.38,d/2+.5+(i%2)*.2,false)}
  [-w/2+.3,w/2-.3].forEach(a=>cl(g,bushG,0x2f7a35,a,.6,d/2+.5));
  const e=rnd()*3|0;
  if(e===0){bx(g,2.4,2.2,2.2,0x9a6b3a,3,1.1,-d/2-2.5);bx(g,2.8,.2,2.6,0x553322,3,2.3,-d/2-2.5);wb(g,3,-d/2-2.5,2.4,2.2)}
  if(e===1){bx(g,4.2,.25,2.8,0xeeeeee,-2,.1,-d/2-3,false);bx(g,3.8,.3,2.4,0x3399dd,-2,.12,-d/2-3,false)}
  if(e===2){cl(g,new THREE.CylinderGeometry(1.2,1.2,.15,12),0x222222,-2,.9,-d/2-3);cl(g,new THREE.CylinderGeometry(.06,.06,.9,4),0x888888,-2,.45,-d/2-3)}
  bx(g,.1,1,.1,0x553311,-5.5,.5,6.8);bx(g,.4,.4,.7,0x2244aa,-5.5,1.1,6.8);
  if(withFence){
    const c=Math.cos(rot),s=Math.sin(rot);
    const w2=(lx,lz)=>[x+lx*c+lz*s,z-lx*s+lz*c];
    const rs=t===3?1.2:w/2-.4;
    let a=w2(-7,6.2),b=w2(-1.2,6.2);fenceLine(a[0],a[1],b[0],b[1]);
    a=w2(rs,6.2);b=w2(7,6.2);fenceLine(a[0],a[1],b[0],b[1]);
    a=w2(-7,-4.5);b=w2(-7,6.2);fenceLine(a[0],a[1],b[0],b[1]);
    a=w2(7,-4.5);b=w2(7,6.2);fenceLine(a[0],a[1],b[0],b[1]);
    a=w2(-7,-4.5);b=w2(7,-4.5);fenceLine(a[0],a[1],b[0],b[1]);
  }
}

// ====================== DOWNTOWN BUILDINGS ======================
function downtown(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const w=14+rnd()*8,d=12+rnd()*6;
  const H=(6+rnd()*10)*3;
  const col=pick([0x667788,0x778899,0x556677,0x8899aa,0x5a6a7a]);
  bx(g,w,H,d,col,0,H/2,0);wb(g,0,0,w,d);
  // windows grid
  const rows=Math.floor(H/3.2),cols=Math.floor(w/2.6);
  const wg=new THREE.BoxGeometry(1.6,1.6,.1);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const wx=-w/2+1.6+c*2.6,wy=2.2+r*3.2;
    bx(g,1.6,1.6,.1,glassMat,wx,wy,d/2+.04,false);
    bx(g,1.6,1.6,.1,glassMat,wx,wy,-d/2-.04,false);
  }
  const rowsZ=Math.floor(H/3.2),colsZ=Math.floor(d/2.6);
  for(let r=0;r<rowsZ;r++)for(let c=0;c<colsZ;c++){
    const wz=-d/2+1.6+c*2.6,wy=2.2+r*3.2;
    bx(g,.1,1.6,1.6,glassMat,w/2+.04,wy,wz,false);
    bx(g,.1,1.6,1.6,glassMat,-w/2-.04,wy,wz,false);
  }
  // rooftop
  bx(g,w*.4,1.5,d*.4,0x445566,w*.2,H+.75,-d*.2);
  if(rnd()<.5)bx(g,2.5,1.2,2.5,0x334455,-w*.25,H+.6,-d*.25);
  // entrance
  bx(g,3,2.5,.15,0x222222,0,1.25,d/2+.08);
}

// ====================== INDUSTRIAL ======================
function warehouse(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const w=20+rnd()*10,d=14+rnd()*6,H=6+rnd()*3;
  bx(g,w,H,d,0x8899a8,0,H/2,0);wb(g,0,0,w,d);
  // roof ridge
  const rf=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,w,3).rotateZ(PI/2),C(0x556677));
  // simple flat roof with vents
  for(let i=0;i<3;i++)bx(g,1.5,1.5,1.5,0x555555,-w/3+i*w/3,H+.75,0);
  // big door
  bx(g,5,4.5,.15,0x333333,0,2.25,d/2+.08);
  // windows high
  for(let i=-2;i<=2;i++)bx(g,1.5,1,.1,winMat,i*3.5,H-1.5,d/2+.05,false);
  // smokestack
  if(rnd()<.6){cl(g,new THREE.CylinderGeometry(.8,1,8,8),0x774433,w*.3,H+4,-d*.3);}
}
function factorySmoke(x,y,z){/* placeholder for particles */}
// storage tanks
function tank(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  cl(g,new THREE.CylinderGeometry(3,3,6,12),0xdde0e4,0,3,0);
  cl(g,new THREE.CylinderGeometry(3.05,3.05,.4,12),0x999999,0,6,0);
  circles.push({x,z,r:3.2});
}

// ====================== SPECIAL BUILDINGS ======================
function school(cx,cz){
  const g=new THREE.Group();g.position.set(cx,0,cz);scene.add(g);
  // L-shape
  bx(g,32,5,12,0xc9a882,-8,2.5,-6);wb(g,-8,-6,32,12);
  bx(g,12,5,24,0xc9a882,-18,2.5,6);wb(g,-18,6,12,24);
  // gym
  bx(g,16,7,14,0xbb8a5a,14,3.5,6);wb(g,14,6,16,14);
  // windows
  for(let i=0;i<10;i++)bx(g,1.6,1.6,.1,winMat,-22+i*3,3,-11.9,false);
  for(let i=0;i<8;i++)bx(g,.1,1.6,1.6,winMat,-23.9,3,-8+i*3,false);
  // flagpole
  cl(g,new THREE.CylinderGeometry(.06,.06,8,5),0xcccccc,6,4,10);
  bx(g,1.6,1,.05,0xcc2222,6.8,6.5,10,false);
  // sign
  const txt=tex(256,64,x=>{x.fillStyle='#1a4a7a';x.fillRect(0,0,256,64);x.fillStyle='#fff';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText('MAPLE SCHOOL',128,46)});
  const s=new THREE.Mesh(new THREE.PlaneGeometry(6,1.5),new THREE.MeshBasicMaterial({map:txt}));
  s.position.set(-8,6,0);s.rotation.y=0;g.add(s);
  // playground
  cl(g,new THREE.CylinderGeometry(.05,.05,2,4),0x888888,6,1,-6);
  bx(g,4,.1,4,0xdddd33,6,2,-6);
  circles.push({x:cx,z:cz,r:24});
}
function church(cx,cz){
  const g=new THREE.Group();g.position.set(cx,0,cz);scene.add(g);

function construction(cx,cz){
  const g=new THREE.Group();g.position.set(cx,0,cz);scene.add(g);
  // dirt ground
  cl(g,new THREE.PlaneGeometry(50,50).rotateX(-PI/2),0x6a5238,0,.06,0,false);
  // partially built frame
  const cols=4,rows=4;const w=20,d=16;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=-w/2+c*(w/(cols-1)),z=-d/2+r*(d/(rows-1));
      bx(g,.5,3,.5,0x999999,x,3*(r+1)-1.5,z);
    }
    bx(g,w,.4,.4,0x999999,0,3*(r+1)-.2,-d/2);
    bx(g,w,.4,.4,0x999999,0,3*(r+1)-.2,d/2);
    bx(g,.4,.4,d,0x999999,-w/2,3*(r+1)-.2,0);
    bx(g,.4,.4,d,0x999999,w/2,3*(r+1)-.2,0);
  }
  wb(g,0,0,w+1,d+1);
  // scaffolding lines
  for(let r=1;r<=rows;r++){
    bx(g,w,.1,.1,0xbb8844,0,3*r,-d/2);
    bx(g,w,.1,.1,0xbb8844,0,3*r,d/2);
  }
  // crane
  const cg=new THREE.Group();cg.position.set(-14,0,0);g.add(cg);
  cl(cg,new THREE.BoxGeometry(3,1.5,3),0xffcc33,0,.75,0);
  cl(cg,new THREE.BoxGeometry(1.2,40,1.2),0xffcc33,0,20,0);
  cl(cg,new THREE.BoxGeometry(40,.8,.8),0xffcc33,12,40,0);
  cl(cg,new THREE.BoxGeometry(8,3,8),0xffcc33,24,40,0);
  bx(cg,2,2,2,0x888888,26,38,0);
  // cable
  cl(cg,new THREE.CylinderGeometry(.05,.05,30,4),0x444444,24,25,0);
  bx(cg,2,1,2,0xaa4444,24,9,0);
  // barriers around site
  const barMat=0xffaa00;
  for(let i=0;i<12;i++){
    const a=i/12*TAU;
    bx(g,2,.8,.4,barMat,Math.cos(a)*24,.5,Math.sin(a)*24).rotation.y=a+PI/2;
    if(i%2)bx(g,2,.8,.4,0xffffff,Math.cos(a)*24,.5,Math.sin(a)*24).rotation.y=a+PI/2;
  }
  circles.push({x:cx,z:cz,r:26});
}

function cemetery(cx,cz){
  const g=new THREE.Group();g.position.set(cx,0,cz);scene.add(g);
  cl(g,new THREE.PlaneGeometry(54,50).rotateX(-PI/2),0x4a7a3a,0,.055,0,false);
  // iron fence posts
  for(let i=0;i<28;i++){
    const a=i/28*TAU*2;
    // will just do rectangular
  }
  // border fence
  const hw=26,hd=24;
  for(let x=-hw;x<=hw;x+=2){
    cl(g,new THREE.CylinderGeometry(.06,.06,2,4),0x222222,x,1,-hd);
    cl(g,new THREE.CylinderGeometry(.06,.06,2,4),0x222222,x,1,hd);
  }
  for(let z=-hd;z<=hd;z+=2){
    cl(g,new THREE.CylinderGeometry(.06,.06,2,4),0x222222,-hw,1,z);
    cl(g,new THREE.CylinderGeometry(.06,.06,2,4),0x222222,hw,1,z);
  }
  // headstones in rows
  for(let r=-4;r<=4;r++){
    for(let c=-5;c<=5;c++){
      if(rnd()<.15)continue;
      const x=c*4+rnd()*.6,z=r*4+rnd()*.6;
      const gs=rnd();
      if(gs<.6){
        cl(g,new THREE.BoxGeometry(.9,1.3,.3),0xb0b0b0,x,.65,z).rotation.y=(rnd()-.5)*.3;
        // rounded top
        cl(g,new THREE.CylinderGeometry(.45,.45,.3,8).rotateZ(PI/2).rotateY(PI/2),0xb0b0b0,x,1.3,z);
      } else if(gs<.85){
        const c2=cl(g,new THREE.BoxGeometry(1.4,.4,1.4),0xa0a0a0,x,.2,z);
        cl(g,new THREE.BoxGeometry(.3,2,.3),0xa0a0a0,x,1.2,z-.4);
        cl(g,new THREE.BoxGeometry(1.2,.3,.3),0xa0a0a0,x,2,z-.4);
      } else {
        cl(g,new THREE.BoxGeometry(.8,2.4,.3),0x8a8a8a,x,1.2,z);
        cl(g,new THREE.BoxGeometry(1.4,.25,.35),0x8a8a8a,x,2.3,z);
      }
      if(rnd()<.1)cl(g,flG,pick([0xffffff,0xffffaa,0xffaaaa]),x,.3,z+1);
    }
  }
  // big tree
  cl(g,new THREE.CylinderGeometry(.4,.6,4,6),0x553322,0,2,0);
  cl(g,new THREE.IcosahedronGeometry(3.5,1),0x2a4a2a,0,6,0);
  // small chapel
  bx(g,6,4,8,0xddddcc,0,2,-20);wb(g,0,-20,6,8);
  circles.push({x:cx,z:cz,r:26});
}

// ====================== CITY BLOCK GENERATION ======================
// Blocks between ROADS
function districtOfBlock(cx,cz){return districtAt(cx,cz);}

const specialAssign={
  // key "i,j" -> type. i=0..4 x-axis (0=west), j=0..4 z-axis (0=north)
};
// Assign: Downtown uses blocks in NW (i<2, j<2)
// Suburbs: NE (i>=3, j<2)
// Industrial: SW (i<2, j>=3)
// Beachfront/SE: (i>=3, j>=3)
// Central: i==2 or j==2 -> commercial

// Specific special placements (i,j):
specialAssign['0,3']='cemetery';
specialAssign['0,4']='construction';
specialAssign['1,4']='industrial';
specialAssign['4,0']='suburbs';
specialAssign['3,3']='school';
specialAssign['3,4']='hospital';
specialAssign['4,3']='police';
specialAssign['4,4']='fire';
specialAssign['2,2']='market';
specialAssign['1,3']='industrial';
specialAssign['4,2']='suburbs';
specialAssign['3,2']='suburbs';
specialAssign['2,0']='suburbs';

const blockList=[];
for(let i=0;i<5;i++)for(let j=0;j<5;j++){
  const x0=ROADS[i],x1=ROADS[i+1],z0=ROADS[j],z1=ROADS[j+1];
  const cx=(x0+x1)/2,cz=(z0+z1)/2;
  blockList.push({i,j,cx,cz,x0,x1,z0,z1,type:specialAssign[i+','+j]||districtAt(cx,cz)});
}

// Market
function market(cx,cz){
  const g=new THREE.Group();g.position.set(cx,0,cz);scene.add(g);
  const w=20,d=12;
  bx(g,w,4.5,d,0xd9c9a8,0,2.25,0);wb(g,0,0,w,d);
  bx(g,w+.6,.3,d+.6,0x7a2a2a,0,4.65,0);
  bx(g,w*.7,2.4,.1,winMat,0,1.5,d/2+.05,false);
  bx(g,w*.9,.2,1.8,0xc0392b,0,3.4,d/2+.9,false).rotation.x=.3;
  const tx=tex(256,64,x=>{x.fillStyle='#1a5c3a';x.fillRect(0,0,256,64);x.fillStyle='#fff';x.font='bold 32px sans-serif';x.textAlign='center';x.fillText('MAPLE MARKET',128,44)});
  const s=new THREE.Mesh(new THREE.PlaneGeometry(7,1.75),new THREE.MeshBasicMaterial({map:tx}));
  s.position.set(0,5.9,d/2+.1);g.add(s);
  bx(g,7.2,2,.2,0x333333,0,5.9,d/2,false);
  bx(g,2.4,.5,.9,0x7a5a3a,-7,.3,d/2+3.5);bx(g,2.4,.5,.2,0x7a5a3a,-7,.8,d/2+3.9);
  circles.push({x:cx,z:cz,r:14});
}

// Now generate block content
blockList.forEach(b=>{
  const {cx,cz,type}=b;
  // skip central
  if(b.i===2&&b.j===2)return;
  if(type==='downtown'){

(function(){
  // Sleepers + rails around rectangle
  const railMat=0x666666,sleeperMat=0x5a3a22;
  function trackSegment(x1,z1,x2,z2){
    const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz);
    const n=Math.round(L/2);
    const ang=Math.atan2(dz,dx);
    for(let i=0;i<=n;i++){
      const t=i/n,x=x1+dx*t,z=z1+dz*t;
      const s=new THREE.Mesh(new THREE.BoxGeometry(.3,.15,3.4),C(sleeperMat));
      s.position.set(x,.15,z);s.rotation.y=ang+PI/2;s.castShadow=true;scene.add(s);
    }
    // rails
    const r1=new THREE.Mesh(new THREE.BoxGeometry(L+2,.1,.15),C(railMat));
    const nx=-Math.sin(ang),nz=Math.cos(ang);
    r1.position.set((x1+x2)/2,.28,(z1+z2)/2);
    r1.rotation.y=-ang;
    // Offset rails perpendicular
    const p1=new THREE.Group();p1.position.set((x1+x2)/2,.28,(z1+z2)/2);
    p1.rotation.y=-ang;
    const r1b=new THREE.Mesh(new THREE.BoxGeometry(L+2,.1,.15),C(railMat));
    r1b.position.set(0,0,1.4);p1.add(r1b);scene.add(p1);
    const p2=new THREE.Group();p2.position.set((x1+x2)/2,.28,(z1+z2)/2);
    p2.rotation.y=-ang;
    const r2b=new THREE.Mesh(new THREE.BoxGeometry(L+2,.1,.15),C(railMat));
    r2b.position.set(0,0,-1.4);p2.add(r2b);scene.add(p2);
  }
  trackSegment(TRACK.minX,TRACK.minZ,TRACK.maxX,TRACK.minZ);
  trackSegment(TRACK.maxX,TRACK.minZ,TRACK.maxX,TRACK.maxZ);
  trackSegment(TRACK.maxX,TRACK.maxZ,TRACK.minX,TRACK.maxZ);
  trackSegment(TRACK.minX,TRACK.maxZ,TRACK.minX,TRACK.minZ);
})();

  const {x,z,axis}=trafficLights[lightIdx];
  const offset=((x*0.01+z*0.013)+1.7)%1;

  // 0-0.42 NS green, 0.42-0.5 NS yellow, 0.5-0.92 EW green, 0.92-1.0 EW yellow
  if(axis==='NS'){

    return 'R';
  } else {

    if(phase>=0.92)return 'Y';
    return 'R';
  }
}

const LANE=2.6;
function makeGridLoop(corners){
  const segs=[];let total=0;
  for(let i=0;i<corners.length;i++){
    const a=corners[i],b=corners[(i+1)%corners.length];
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    segs.push({a,b,len,start:total});total+=len;
  }
  return {segs,total};
}
function placeOnLoop(loop,d){
  d=((d%loop.total)+loop.total)%loop.total;
  for(const s of loop.segs){
    if(d<s.start+s.len){
      const t=(d-s.start)/s.len;
      return {
        x:s.a[0]+(s.b[0]-s.a[0])*t,
        z:s.a[1]+(s.b[1]-s.a[1])*t,
        ang:Math.atan2(-(s.b[1]-s.a[1]),s.b[0]-s.a[0])
      };
    }
  }
  return {x:0,z:0,ang:0};
}

let joyId=null,lookId=null,lx=0,ly=0;
addEventListener('touchstart',()=>{if(!touch){touch=true;joy.style.display='block'}},{once:true});
joy.addEventListener('touchstart',e=>{joyId=e.changedTouches[0].identifier;e.preventDefault()},{passive:false});
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches)
    if(t.identifier!==joyId&&t.clientX>innerWidth*.4&&lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY}
});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const r=joy.getBoundingClientRect();
      let dx=t.clientX-(r.left+55),dy=t.clientY-(r.top+55);
      const l=Math.hypot(dx,dy);
      if(l>45){dx*=45/l;dy*=45/l}
      tv.x=dx/45;tv.y=dy/45;
      knob.style.transform=`translate(${dx}px,${dy}px)`;
    }else if(t.identifier===lookId){
      P.yaw-=(t.clientX-lx)*.005;
      P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-(t.clientY-ly)*.005));
      lx=t.clientX;ly=t.clientY;
    }
  }
},{passive:true});
addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyId=null;tv.x=tv.y=0;knob.style.transform=''}
    if(t.identifier===lookId)lookId=null;
  }
});

function collide(){
  const R=.45;
  for(const b of boxes){
    const cx=Math.max(b.x0,Math.min(P.x,b.x1)),cz=Math.max(b.z0,Math.min(P.z,b.z1));
    let dx=P.x-cx,dz=P.z-cz,d=Math.hypot(dx,dz);
    if(d<R){if(d===0){P.x=b.x0-R;continue}P.x=cx+dx/d*R;P.z=cz+dz/d*R}
  }
  for(const c of circles){
    const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz),m=c.r+R;
    if(d<m&&d>0){P.x=c.x+dx/d*m;P.z=c.z+dz/d*m}
  }
  P.x=Math.max(-280,Math.min(280,P.x));
  P.z=Math.max(-280,Math.min(280,P.z));
}

// ====================== UI ======================
const mm=document.getElementById('mm'),mctx=mm.getContext('2d');
const districtEl=document.getElementById('district');
const compassEl=document.getElementById('compass');
let currentDistrict='';
function drawMM(){
  const w=mm.width,h=mm.height;
  mctx.fillStyle='rgba(20,40,30,.85)';mctx.fillRect(0,0,w,h);
  const scale=(w/2)/(ROADS[ROADS.length-1]+40);
  const o=w/2;
  // district zones
  mctx.fillStyle='rgba(127,179,255,.35)';mctx.fillRect(o-160*scale,o-160*scale,160*scale,160*scale);
  mctx.fillStyle='rgba(142,209,122,.35)';mctx.fillRect(o,o-160*scale,160*scale,160*scale);
  mctx.fillStyle='rgba(201,162,98,.35)';mctx.fillRect(o-160*scale,o,160*scale,160*scale);
  mctx.fillStyle='rgba(232,196,160,.35)';mctx.fillRect(o,o,160*scale,160*scale);
  mctx.fillStyle='rgba(196,138,138,.4)';mctx.fillRect(o+170*scale,o-160*scale,100*scale,160*scale);
  // roads
  mctx.fillStyle='#555';
  ROADS.forEach(x=>mctx.fillRect(o+x*scale-2,o-200*scale,4,400*scale));
  ROADS.forEach(z=>mctx.fillRect(o-200*scale,o+z*scale-2,400*scale,4));
  // buildings
  mctx.fillStyle='#9ab';
  boxes.forEach(b=>{
    const x=o+b.x0*scale,y=o+b.z0*scale;
    const bw=Math.max(1,(b.x1-b.x0)*scale),bh=Math.max(1,(b.z1-b.z0)*scale);
    mctx.fillRect(x,y,bw,bh);
  });
  // cars
  mctx.fillStyle='#fa0';
  movingCars.forEach(c=>mctx.fillRect(o+c.g.position.x*scale-1.5,o+c.g.position.z*scale-1.5,3,3));
  // player
  mctx.save();mctx.translate(o+P.x*scale,o+P.z*scale);mctx.rotate(-P.yaw);
  mctx.fillStyle='#fff';mctx.beginPath();mctx.moveTo(0,-6);mctx.lineTo(4,5);mctx.lineTo(-4,5);mctx.fill();
  mctx.restore();
}

// ====================== MAIN LOOP ======================
let last=performance.now(),tm=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;

  if(Math.abs(nT-nTarget)>.002){nT+=(nTarget-nT)*Math.min(1,dt*1.5);setT(nT)}

  // Player
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-tv.y;
  let s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+tv.x;
  const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
  const sprinting=keys.ShiftLeft||keys.ShiftRight||sprintToggle;
  const spd=(sprinting?9:4.5)*dt;
  if(locked){
    const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
    P.x+=(-sy*f+cy*s)*spd;P.z+=(-cy*f-sy*s)*spd;
    collide();
    if(l>0&&P.y===0)P.bob+=spd*1.6;
    if(keys.Space&&P.y===0)P.vy=7;
    P.vy-=20*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0)P.vy=0;
  }

  // Traffic light state updates
  const lightStates=trafficLights.map((_,i)=>lightState(i,tm));
  trafficLights.forEach((tl,i)=>{
    const st=lightStates[i];
    tl.rr.material=tRed.clone();
    tl.yy.material=tYel.clone();
    tl.gg.material=tGrn.clone();
    const on=t=>{tl.rr.material.emissiveIntensity=0;tl.yy.material.emissiveIntensity=0;tl.gg.material.emissiveIntensity=0;
      if(t==='R')tl.rr.material.emissiveIntensity=1.6;
      if(t==='Y')tl.yy.material.emissiveIntensity=1.6;
      if(t==='G')tl.gg.material.emissiveIntensity=1.6;};
    on(st);
  });

  // Moving cars
  movingCars.forEach(c=>{
    const p=placeOnLoop(c.loop,c.dist);
    const ang=p.ang;
    // look ahead for light
    const look=10;
    const aheadX=p.x+Math.cos(ang)*look, aheadZ=p.z-Math.sin(ang)*look;
    // find nearest road intersection near ahead
    let stopForLight=false;
    const nearX=ROADS.reduce((a,b)=>Math.abs(b-aheadX)<Math.abs(a-aheadX)?b:a);
    const nearZ=ROADS.reduce((a,b)=>Math.abs(b-aheadZ)<Math.abs(a-aheadZ)?b:a);
    if(Math.abs(aheadX-nearX)<7&&Math.abs(aheadZ-nearZ)<7){
      // which axis is car on?
      const onX=Math.abs(p.z-nearZ)<3;
      const axis=onX?'EW':'NS';
      // find nearest light of that axis
      let idx=-1;
      trafficLights.forEach((tl,i)=>{
        if(tl.axis===axis&&Math.abs(tl.x-nearX)<2&&Math.abs(tl.z-nearZ)<2){idx=i}
      });
      if(idx>=0&&lightStates[idx]==='R')stopForLight=true;
    }
    // yield to player
    const dx=P.x-p.x,dz=P.z-p.z,dist=Math.hypot(dx,dz);
    let yieldPlayer=false;
    if(dist<8){
      const fwdX=Math.cos(ang),fwdZ=-Math.sin(ang);
      const dot=dx*fwdX+dz*fwdZ;
      if(dot>0&&dot<8)yieldPlayer=true;
    }
    let target=c.base;
    if(stopForLight||yieldPlayer)target=0;
    c.speed+=(target-c.speed)*Math.min(1,dt*2.5);
    c.dist+=c.speed*dt;
    const np=placeOnLoop(c.loop,c.dist);
    c.g.position.set(np.x,0,np.z);
    c.g.rotation.y=np.ang;
  });

  // Train
  trainCars.forEach(t=>{
    t.dist+=t.speed*dt;
    t.cars.forEach(car=>{
      const p=t.placeOnTrack(t.dist+car.offset);
      car.g.position.set(p.x,.5,p.z);
      car.g.rotation.y=p.ang;
    });
  });

  // Pedestrians
  walkers.forEach(w=>{
    w.pos+=w.dir*w.sp*dt;
    if(Math.abs(w.pos)>w.L)w.dir*=-1;
    const g=w.g;
    if(w.onX){g.position.set(w.pos,0,w.c);g.rotation.y=w.dir>0?PI/2:-PI/2}
    else{g.position.set(w.c,0,w.pos);g.rotation.y=w.dir>0?0:PI}
    const sw=Math.sin(tm*w.sp*5)*.6,lg=g.userData.legs,ar=g.userData.arms;
    lg[0].rotation.x=sw;lg[1].rotation.x=-sw;
    ar[0].rotation.x=-sw*.8;ar[1].rotation.x=sw*.8;
  });

  // Fountain
  fountainDrops.forEach(s=>{
    s.stream.forEach((d,j)=>{
      const t=((tm*1.1+s.phase+j*0.18)%1);
      const r=1.5+2.5*t;
      const y=3.5+3*Math.sin(t*PI)-2.65*t;
      d.position.set(PK.x+Math.cos(s.angle)*r,Math.max(.9,y),PK.z+Math.sin(s.angle)*r);
      d.material.opacity=.9*Math.max(0,1-Math.max(0,(t-0.85)*6));
    });
  });

  // Clouds
  clouds.forEach(c=>{c.position.x+=dt*2;if(c.position.x>280)c.position.x=-280});

  // Camera
  camera.position.set(P.x,1.7+P.y+Math.sin(P.bob)*.045,P.z);
  camera.rotation.set(P.pitch,P.yaw,0);
  stars.position.copy(camera.position);
  sun.position.set(P.x+80,120,P.z+60);
  sun.target.position.set(P.x,0,P.z);sun.target.updateMatrixWorld();

  // District + compass UI
  const dz=districtAt(P.x,P.z);
  if(dz!==currentDistrict){
    currentDistrict=dz;
    districtEl.textContent=dz.charAt(0).toUpperCase()+dz.slice(1);
  }
  const compassDir=(()=>{
    const yaw=(P.yaw%(TAU)+TAU)%TAU;
    if(yaw<PI/8||yaw>TAU-PI/8)return 'N';
    if(yaw<3*PI/8)return 'NW';
    if(yaw<5*PI/8)return 'W';
    if(yaw<7*PI/8)return 'SW';
    if(yaw<9*PI/8)return 'S';
    if(yaw<11*PI/8)return 'SE';
    if(yaw<13*PI/8)return 'E';
    if(yaw<15*PI/8)return 'NE';
    return 'N';
  })();
  compassEl.textContent=compassDir;

  renderer.render(scene,camera);
  drawMM();
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
requestAnimationFrame(loop);
})();
</script></body></html>
